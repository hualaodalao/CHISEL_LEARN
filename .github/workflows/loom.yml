name: loom

on:
  push:
    paths:
      - "src/loom/**"
      - "build.sbt"
      - ".github/workflows/loom.yml"
  pull_request:
    paths:
      - "src/loom/**"
      - "build.sbt"
      - ".github/workflows/loom.yml"

jobs:
  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: install verilator and yosys
        run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - name: compile
        run: sbt -batch Test/compile
      # S6/MIG-11: the legacy four-channel suites live in src/loom/legacy/
      # (outside the compiled source paths) and are intentionally not run here.
      - name: unit and simulation tests (loom/v2 CHI caliber)
        run: sbt -J-Xmx6G -batch "testOnly loom.*"
      - name: CI matrix (v2 examples, CHI tops)
        run: ./src/loom/scripts/ci_matrix.sh
