name: loom

on:
  push:
    paths:
      - "src/loom/**"
      - "build.sbt"
      - ".github/workflows/loom.yml"
  pull_request:
    paths:
      - "src/loom/**"
      - "build.sbt"
      - ".github/workflows/loom.yml"

jobs:
  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: install verilator and yosys
        run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - name: compile
        run: sbt -batch Test/compile
      - name: unit and simulation tests
        run: sbt -J-Xmx6G -batch "testOnly loom.*"
      - name: CI matrix
        run: ./src/loom/scripts/ci_matrix.sh
